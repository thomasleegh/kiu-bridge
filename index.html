<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>橋 Kiu · Cantonese ↔ Mandarin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kiu">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Fonts load without blocking first paint (an @import here held the whole page until Google answered,
     and hung offline). System fonts show until they arrive; the service worker caches them for offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>

:root{
  --ink:#14161B;
  --surface:#1D2027;
  --surface-2:#262A33;
  --paper:#EDEAE1;
  --muted:#8A8F9C;
  --canto:#E8543E;
  --canto-dim:rgba(232,84,62,0.14);
  --canto-line:rgba(232,84,62,0.55);
  --mando:#45A395;
  --mando-dim:rgba(69,163,149,0.14);
  --mando-line:rgba(69,163,149,0.55);
  --gold:#D8A657;
  --divider:rgba(237,234,225,0.09);
  --good:#5FAE7A;
  --bad:#D8604F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding-bottom:env(safe-area-inset-bottom);
}
.hanzi-font{font-family:'Noto Serif TC',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-appearance:none;appearance:none;margin:0;box-sizing:border-box;}
::selection{background:var(--gold);color:var(--ink);}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 20px 14px 20px;
}
.wordmark{display:flex;align-items:baseline;gap:10px;}
.wordmark .glyph{font-family:'Noto Serif TC',serif;font-weight:900;font-size:26px;color:var(--gold);}
.wordmark .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.streak{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--divider);
  padding:6px 12px;border-radius:100px;font-size:13px;font-weight:600;
}
.streak svg{width:14px;height:14px;}

/* ---------- home ---------- */
.home-scroll{flex:1;padding:6px 20px 32px 20px;overflow-y:auto;}
.hero{
  background:linear-gradient(160deg,var(--surface) 0%, var(--surface-2) 100%);
  border:1px solid var(--divider);
  border-radius:20px;
  padding:26px 22px;
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
}
.hero-bridge{
  display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:18px;
}
.hero-pill{
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;
  padding:5px 10px;border-radius:8px;letter-spacing:.02em;
}
.hero-pill.c{background:var(--canto-dim);color:var(--canto);}
.hero-pill.m{background:var(--mando-dim);color:var(--mando);}
.hero-line{width:26px;height:1px;background:var(--divider);margin:0 8px;}
.hero-hanzi{font-family:'Noto Serif TC',serif;font-weight:700;font-size:20px;margin:0 10px;color:var(--paper);}
.hero h1{font-size:20px;margin:0 0 6px 0;font-weight:700;line-height:1.35;}
.hero p{font-size:13.5px;color:var(--muted);margin:0 0 20px 0;line-height:1.5;}
.stat-row{display:flex;gap:10px;margin-bottom:18px;}
.stat{flex:1;background:rgba(0,0,0,0.18);border-radius:12px;padding:10px 12px;text-align:left;transition:background .12s ease;}
.stat:active{background:rgba(0,0,0,0.3);}
.stat .n{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
.btn-primary{
  width:100%;background:var(--gold);color:var(--ink);
  padding:14px 18px;border-radius:13px;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease, opacity .12s ease;
}
.btn-primary:active{transform:scale(0.98);}
.btn-secondary{
  width:100%;background:transparent;border:1px solid var(--divider);color:var(--paper);
  padding:12px 18px;border-radius:13px;font-weight:600;font-size:14px;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-secondary:disabled{opacity:.35;}
.btn-primary svg,.btn-secondary svg{width:16px;height:16px;flex-shrink:0;}
.btn-secondary:active:not(:disabled){transform:scale(0.98);}

.section-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px 4px;font-weight:600;}

.tab-bar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:5px;margin-bottom:22px;}
.tab-bar.primary{height:56px;}
.tab-bar.secondary{height:40px;}
.tab-btn{flex:1;height:40px;padding:0 10px;border-radius:10px;font-weight:700;font-size:13px;line-height:1;color:var(--muted);white-space:nowrap;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
.tab-btn.active{background:var(--gold);color:var(--ink);}
.tab-bar.primary .tab-btn{height:46px;font-size:14.5px;}
.tab-bar.secondary .tab-btn{height:30px;font-size:12px;}

.convo-card{background:var(--surface);border:1px solid var(--divider);border-radius:16px;padding:16px 16px 6px 16px;margin-bottom:14px;}
.convo-title{font-size:13.5px;font-weight:700;margin-bottom:14px;}
.convo-line{display:flex;gap:10px;margin-bottom:14px;}
.convo-who{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;}
.convo-body .eng{font-size:12.5px;color:var(--muted);margin-bottom:5px;}
.convo-rom{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.convo-rom.c{color:var(--canto);}
.convo-rom.m{color:var(--mando);}

.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-card{
  background:var(--surface);border:1px solid var(--divider);border-radius:14px;
  padding:14px 14px;text-align:left;position:relative;overflow:hidden;
}
.cat-card .name{font-size:14px;font-weight:600;margin-bottom:8px;}
.cat-card .bar-track{height:4px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:6px;}
.cat-card .bar-fill{height:100%;background:var(--gold);border-radius:4px;}
.cat-card .frac{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

/* ---------- session chrome ---------- */
.session-top{padding:16px 18px 10px 18px;display:flex;align-items:center;gap:12px;}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn svg{width:16px;height:16px;}
.dots{flex:1;display:flex;gap:5px;}
.dot{flex:1;height:5px;border-radius:4px;background:var(--surface-2);}
.dot.done{background:var(--gold);}
.dot.current{background:var(--paper);}

.session-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 26px 26px 26px;}
.cat-tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;}
.eng{font-size:15px;color:var(--muted);margin-bottom:26px;text-align:center;}

.bridge-card{display:flex;flex-direction:column;align-items:center;width:100%;max-width:300px;}
.rail{
  width:100%;text-align:center;padding:14px 16px;border-radius:14px;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:clamp(17px,5.2vw,21px);
  line-height:1.3;position:relative;
  transition:opacity .25s ease, filter .25s ease;
}
.rail.canto{background:var(--canto-dim);color:var(--canto);}
.rail.mando{background:var(--mando-dim);color:var(--mando);}
.rail-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;}
.rail .tag{font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700;}
.lit{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:500;font-style:italic;opacity:.65;margin-top:4px;letter-spacing:.01em;}
.speak-btn{
  position:relative;z-index:1;-webkit-appearance:none;appearance:none;padding:0;
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.14);transition:transform .1s ease,background .1s ease;
}
.speak-btn:active{transform:scale(0.9);background:rgba(255,255,255,0.24);}
.speak-btn svg{width:12px;height:12px;}
.speak-btn.canto{color:var(--canto);}
.speak-btn.mando{color:var(--mando);}
.speak-btn.small{width:20px;height:20px;background:transparent;border:1px solid currentColor;opacity:.65;}
.speak-btn.small svg{width:10px;height:10px;}
/* Invisible finger-sized tap area (~44px) around the small circles. */
.speak-btn::after{content:'';position:absolute;inset:-10px;border-radius:50%;}
.speak-btn.small::after{inset:-12px;}
.speak-btn.playing{opacity:1;animation:speakPulse 1s ease-in-out infinite;}
@keyframes speakPulse{0%,100%{box-shadow:0 0 0 0 currentColor;}50%{box-shadow:0 0 0 4px transparent;}}
.connector{width:2px;height:16px;background:var(--divider);margin:0 auto;}
.connector.c-top{background:linear-gradient(var(--canto-line),var(--divider));}
.connector.c-bot{background:linear-gradient(var(--divider),var(--mando-line));}
.hanzi-wrap{padding:0 0 4px 0;margin-top:18px;}
.hanzi{font-family:'Noto Serif TC',serif;font-weight:500;font-size:30px;line-height:1;letter-spacing:.02em;color:var(--muted);text-align:center;}

.hidden-veil{filter:blur(7px);opacity:.35;pointer-events:none;user-select:none;}

.reveal-btn{
  margin-top:22px;background:var(--surface);border:1px solid var(--divider);
  padding:11px 22px;border-radius:100px;font-size:13.5px;font-weight:600;color:var(--paper);
}
.note-flag{
  margin-top:16px;max-width:300px;background:rgba(216,166,87,0.1);border:1px solid rgba(216,166,87,0.3);
  border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--gold);line-height:1.5;
  display:flex;gap:8px;
}
.note-flag svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;}

.rate-row{display:flex;gap:10px;width:100%;max-width:300px;margin-top:26px;}
.rate-btn{
  flex:1;padding:13px 10px;border-radius:13px;font-weight:700;font-size:13.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.rate-btn.shaky{background:var(--surface);border:1px solid var(--divider);color:var(--paper);}
.rate-btn.got-it{background:var(--good);color:var(--ink);}
.rate-btn span{font-weight:400;font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.06em;}

/* ---------- quiz ---------- */
.quiz-q{font-size:13.5px;color:var(--muted);margin-bottom:6px;text-align:center;}
.quiz-hanzi{font-family:'Noto Serif TC',serif;font-weight:700;font-size:48px;margin-bottom:6px;}
.quiz-eng{font-size:14px;color:var(--muted);margin-bottom:24px;}
.opt-grid{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;}
.opt{
  padding:13px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--divider);
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:left;
}
.opt.correct{background:rgba(95,174,122,0.16);border-color:var(--good);color:var(--good);}
.opt.wrong{background:rgba(216,96,79,0.16);border-color:var(--bad);color:var(--bad);}
.opt:disabled{opacity:.55;}
.score-pill{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;background:var(--surface);padding:6px 12px;border-radius:100px;}

/* ---------- summary ---------- */
.summary-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
.summary-icon{font-family:'Noto Serif TC',serif;font-size:44px;color:var(--gold);margin-bottom:14px;font-weight:900;}
.summary-wrap h2{font-size:20px;margin:0 0 8px 0;}
.summary-wrap p{color:var(--muted);font-size:14px;margin:0 0 22px 0;line-height:1.5;max-width:280px;}
.summary-stats{display:flex;gap:14px;margin-bottom:26px;}
.summary-stats .s{background:var(--surface);border-radius:14px;padding:14px 20px;}
.summary-stats .s .n{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;}
.summary-stats .s .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}

/* ---------- browse ---------- */
.browse-list{flex:1;overflow-y:auto;padding:4px 18px 30px 18px;}
.browse-item{
  display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--divider);
}
.browse-item .h{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;width:56px;text-align:center;flex-shrink:0;}
.browse-item .mid{flex:1;min-width:0;}
.browse-item .mid .e{font-size:13px;color:var(--muted);margin-bottom:4px;}
.browse-item .rails{display:flex;gap:8px;flex-wrap:wrap;}
.browse-item .rails span{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;}
.browse-item .rails .c{background:var(--canto-dim);color:var(--canto);}
.browse-item .rails .m{background:var(--mando-dim);color:var(--mando);}
.browse-item .flag{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}

.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}

/* ---------- role-play ---------- */
.lang-toggle{display:flex;gap:8px;margin-bottom:14px;}
.lt-btn{flex:1;padding:11px 10px;border-radius:12px;font-weight:700;font-size:12.5px;border:1px solid var(--divider);background:var(--surface);color:var(--muted);}
.lt-btn.active.canto{background:var(--canto-dim);color:var(--canto);border-color:var(--canto-line);}
.lt-btn.active.mando{background:var(--mando-dim);color:var(--mando);border-color:var(--mando-line);}
.mic-warn{font-size:12px;color:var(--gold);background:rgba(216,166,87,0.1);border:1px solid rgba(216,166,87,0.3);border-radius:12px;padding:10px 14px;margin-bottom:14px;line-height:1.5;}
.mic-warn.subtle{color:var(--muted);background:var(--surface);border-color:var(--divider);}
.scenario-card{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--divider);
  border-radius:16px;padding:16px 18px;margin-bottom:10px;
}
.scenario-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.scenario-sub{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.scenario-meta{font-size:11px;color:var(--gold);font-family:'IBM Plex Mono',monospace;font-weight:600;}

.npc-bubble{
  background:var(--surface);border:1px solid var(--divider);border-radius:16px 16px 16px 4px;
  padding:16px 18px;width:100%;max-width:320px;margin-bottom:24px;
}
.npc-eng{font-size:14px;color:var(--muted);margin-bottom:8px;}
.npc-rom{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
.npc-rom.canto{color:var(--canto);}
.npc-rom.mando{color:var(--mando);}

.your-turn-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;}
.mic-btn{
  width:88px;height:88px;border-radius:50%;background:var(--surface);border:2px solid var(--divider);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--paper);
  transition:background .15s ease,border-color .15s ease,transform .1s ease;
}
.mic-btn svg{width:26px;height:26px;}
.mic-btn span{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.mic-btn.live{background:rgba(232,84,62,0.14);border-color:var(--canto);animation:pulseMic 1.4s ease infinite;}
.mic-btn.live svg{color:var(--canto);}
.mic-btn.live span{color:var(--canto);}
.mic-btn:active{transform:scale(0.96);}
@keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(232,84,62,0.35);}50%{box-shadow:0 0 0 10px rgba(232,84,62,0);}}
@media (prefers-reduced-motion:reduce){.mic-btn.live{animation:none;}}

.transcript-box{
  margin-top:18px;width:100%;max-width:300px;min-height:44px;
  background:rgba(0,0,0,0.18);border:1px dashed var(--divider);border-radius:12px;
  padding:12px 16px;font-size:13.5px;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;
}
.transcript-box.has-text{color:var(--paper);border-style:solid;border-color:var(--divider);font-weight:500;}

.help-row{display:flex;gap:10px;width:100%;max-width:300px;margin-top:22px;}
.help-row .btn-secondary{margin-top:0;}
.next-btn{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700;}

.help-panel{
  margin-top:16px;width:100%;max-width:300px;background:rgba(216,166,87,0.08);
  border:1px solid rgba(216,166,87,0.3);border-radius:14px;padding:14px 16px;
}
.help-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.help-eng{font-size:13px;color:var(--muted);margin-bottom:6px;}
.help-rom{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;margin-bottom:4px;}
.help-rom.canto{color:var(--canto);}
.help-rom.mando{color:var(--mando);}
.help-char{font-family:'Noto Serif TC',serif;font-size:16px;color:var(--muted);opacity:.7;}

/* ---------- add words ---------- */
.add-form{background:var(--surface);border:1px solid var(--divider);border-radius:16px;padding:16px;margin-bottom:20px;}
.add-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 6px 0;}
.add-label:first-child{margin-top:0;}
.add-label.canto-c{color:var(--canto);}
.add-label.mando-c{color:var(--mando);}
.add-input{
  width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--divider);color:var(--paper);
  padding:10px 12px;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:13.5px;
}
.add-input::placeholder{color:var(--muted);opacity:.6;}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.browse-item .del-btn{width:28px;height:28px;border-radius:50%;background:rgba(216,96,79,0.12);color:var(--bad);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.browse-item .del-btn svg{width:12px;height:12px;}
.custom-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);background:rgba(216,166,87,0.14);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;}

.dict-status{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
.dict-status:empty{display:none;}
#addResults:not(:empty){margin-top:12px;}
.dict-card{background:rgba(0,0,0,0.18);}
.dict-card .scan-result-rails span{display:inline-flex;align-items:center;gap:6px;}
.dict-chars{font-family:'Noto Serif TC',serif;font-size:13px;color:var(--muted);opacity:.7;}
.dict-note{font-size:11.5px;color:var(--gold);margin-top:6px;line-height:1.45;}
.scan-add-btn:disabled{opacity:1;}

/* ---------- scan ---------- */
.scan-drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border:1.5px dashed var(--divider);border-radius:16px;padding:36px 20px;text-align:center;
  background:var(--surface);cursor:pointer;
}
.scan-drop svg{width:28px;height:28px;color:var(--gold);}
.scan-drop .t1{font-size:14px;font-weight:700;}
.scan-drop .t2{font-size:12px;color:var(--muted);}

@media (prefers-reduced-motion:reduce){.scan-loading .spin{animation:none;}}
.scan-result-card{background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.scan-result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.scan-result-eng{font-size:14px;font-weight:700;}
.scan-add-btn{
  flex-shrink:0;font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:100px;

}
.scan-add-btn.added{background:var(--surface-2);color:var(--good);}
.scan-result-rails{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.scan-result-rails span{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;}
.scan-result-rails .c{background:var(--canto-dim);color:var(--canto);}
.scan-result-rails .m{background:var(--mando-dim);color:var(--mando);}

#libSearch{margin-bottom:10px;}
.lib-chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.lib-chip{-webkit-appearance:none;appearance:none;height:30px;padding:0 11px;border-radius:100px;background:var(--surface);border:1px solid var(--divider);color:var(--muted);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.lib-chip.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.lib-chip .lib-n{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75;}

.lib-shaky{font-size:10px;color:var(--gold);font-family:'IBM Plex Mono',monospace;flex-shrink:0;}

/* ---------- progress list ---------- */
.p-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.p-dot.learning{background:var(--gold);}

.p-mid{flex:1;min-width:0;}
.p-eng{font-size:13.5px;font-weight:600;margin-bottom:2px;}
.p-rom{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none;}}

// Detect whether we're running inside Claude's artifact sandbox (window.storage
// already exists there) or as a standalone deployed app (it doesn't). This one
// file adapts its behavior for both, so there's only ever one version to maintain.
const IS_STANDALONE = typeof window.storage === 'undefined';

if(IS_STANDALONE){
  const LS_PREFIX = 'kiu_';
  window.storage = {
    get: async (key) => {
      try{
        const v = localStorage.getItem(LS_PREFIX+key);
        return v===null ? null : {key, value:v, shared:false};
      }catch(e){ return null; }
    },
    set: async (key, value) => {
      try{ localStorage.setItem(LS_PREFIX+key, value); return {key, value, shared:false}; }
      catch(e){ return null; }
    },
    delete: async (key) => {
      try{ localStorage.removeItem(LS_PREFIX+key); return {key, deleted:true, shared:false}; }
      catch(e){ return null; }
    },
    list: async (prefix) => {
      try{
        const full = LS_PREFIX + (prefix||'');
        const keys = Object.keys(localStorage).filter(k=>k.startsWith(full)).map(k=>k.slice(LS_PREFIX.length));
        return {keys, shared:false};
      }catch(e){ return null; }
    }
  };
}

// iOS reports voice langs as zh-HK, zh_HK or yue-…; match all of them.
function pickVoice(prefix){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  const want = prefix.toLowerCase();
  const norm = v => String(v.lang || '').replace('_', '-').toLowerCase();
  return voices.find(v=>norm(v).startsWith(want))
    || (want === 'zh-hk' ? voices.find(v=>norm(v).startsWith('yue')) : null)
    || null;
}
let audioWarned = false;
let currentUtter = null, playingBtn = null, speakWatchdog = null, lastSpoken = {text:'', at:0}, retryHinted = false;
const NO_SOUND_HELP = 'No sound? Flip the silent switch on the side of your iPhone off and turn the volume up. Still nothing: Settings › Accessibility › Spoken Content › Voices › Chinese.';
function setPlaying(btn){
  if(playingBtn && playingBtn !== btn) playingBtn.classList.remove('playing');
  playingBtn = btn || null;
  if(btn) btn.classList.add('playing');
}
function speak(text, prefix, fallbackLang, warnLabel, btn){
  const synth = window.speechSynthesis;
  if(!synth || typeof SpeechSynthesisUtterance === 'undefined'){ showAudioNote("This browser can't play pronunciation audio."); return; }
  // Tapping the same word again soon after = probably heard nothing; say why once.
  const now = Date.now();
  if(!retryHinted && lastSpoken.text === text && now - lastSpoken.at < 8000){ retryHinted = true; showAudioNote(NO_SOUND_HELP); }
  lastSpoken = {text, at: now};
  // Safari 17+: let speech play even with the silent switch on.
  try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  const go = ()=>{
    try{
      const u = new SpeechSynthesisUtterance(text);
      const voice = pickVoice(prefix);
      if(voice){ u.voice = voice; u.lang = voice.lang; }
      else {
        u.lang = fallbackLang;
        if(!audioWarned){
          audioWarned = true;
          showAudioNote(`No ${warnLabel} voice found on this device — playing with the closest available voice instead.`);
        }
      }
      u.rate = 0.82;
      currentUtter = u; // keep a reference: some engines drop callbacks for garbage-collected utterances
      setPlaying(btn);
      clearTimeout(speakWatchdog);
      const done = ()=>{ if(currentUtter !== u) return; clearTimeout(speakWatchdog); currentUtter = null; setPlaying(null); };
      u.onstart = ()=>{ if(currentUtter === u) clearTimeout(speakWatchdog); };
      u.onend = done;
      u.onerror = (e)=>{
        const err = e && e.error;
        done();
        if(err && err !== 'interrupted' && err !== 'canceled') showAudioNote(`Couldn't play audio (${err}). ` + NO_SOUND_HELP);
      };
      // Never started: no voice, audio blocked or the engine is stuck — say so instead of failing silently.
      speakWatchdog = setTimeout(()=>{
        if(currentUtter !== u) return;
        currentUtter = null; setPlaying(null);
        try{ synth.cancel(); }catch(e){}
        showAudioNote(NO_SOUND_HELP);
      }, 3000);
      if(synth.paused) synth.resume();
      synth.speak(u);
    }catch(e){ setPlaying(null); showAudioNote(NO_SOUND_HELP); }
  };
  // Safari drops a speak() made right after cancel(), so only cancel when something is playing,
  // and then give it a moment. When idle, speak straight away (still inside the tap, which iOS requires).
  if(synth.speaking || synth.pending || currentUtter){
    currentUtter = null; clearTimeout(speakWatchdog);
    try{ synth.cancel(); }catch(e){}
    setTimeout(go, 80);
  } else go();
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let recActive = null;
function startRecognition(lang, onResult, onEnd, onError){
  if(!SpeechRec){ onError && onError('unsupported'); return; }
  try{
    if(recActive){ try{ recActive.stop(); }catch(e){} }
    const rec = new SpeechRec();
    rec.lang = lang;
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    let finalText = '';
    rec.onresult = (ev)=>{
      let interim = '';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const t = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) finalText += t; else interim += t;
      }
      onResult(finalText || interim, !!finalText);
    };
    rec.onerror = (ev)=>{ onError && onError(ev.error); };
    rec.onend = ()=>{ recActive = null; onEnd && onEnd(); };
    recActive = rec;
    rec.start();
  }catch(e){ onError && onError('failed'); }
}
function stopRecognition(){
  if(recActive){ try{ recActive.stop(); }catch(e){} }
}

// Builds the right fetch config for either environment:
// - Inside Claude: no key needed, the artifact sandbox handles auth invisibly.
// - Standalone: requires the user's own API key, sent via the direct-browser-access headers.
function apiHeaders(){
  if(!IS_STANDALONE) return { "Content-Type": "application/json" };
  if(!apiKey) throw new Error('nokey');
  return {
    "Content-Type": "application/json",
    "x-api-key": apiKey,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true"
  };
}

async function translateEntry(engText){
  const prompt = `You are a bilingual dictionary assistant for a heritage Cantonese speaker learning to speak both Cantonese and Mandarin. For the English word or phrase below, respond with ONLY a raw JSON object (no markdown fences, no preamble, no explanation) with exactly these fields:

{
  "type": "word" or "phrase" (use "phrase" if this is a multi-word conversational expression/sentence someone would say in a specific situation; use "word" if it's a single vocabulary item or short fixed term),
  "cChar": Cantonese Traditional characters,
  "cRom": Jyutping romanization with tone numbers, words space-separated,
  "mChar": Mandarin Traditional characters,
  "mRom": Hanyu Pinyin romanization with tone marks, words space-separated,
  "lit": a short literal/word-for-word gloss in English, ONLY if it meaningfully differs from the idiomatic English meaning — otherwise an empty string,
  "note": one short sentence noting it ONLY if Cantonese and Mandarin use genuinely different vocabulary/characters for this concept — otherwise an empty string
}

English word or phrase: "${engText}"`;

  let response;
  try{
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: apiHeaders(),
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
  }catch(e){
    if(e.message === 'nokey') throw e;
    throw new Error('network');
  }
  if(response.status === 401 || response.status === 403) throw new Error('badkey');
  if(!response.ok) throw new Error('api');
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('');
  // Be tolerant of any stray preamble/fencing the model might add despite instructions —
  // grab the substring between the first '{' and the last '}' rather than requiring a clean response.
  const start = textBlocks.indexOf('{');
  const end = textBlocks.lastIndexOf('}');
  if(start === -1 || end === -1 || end < start) throw new Error('parse');
  let parsed;
  try{
    parsed = JSON.parse(textBlocks.slice(start, end+1));
  }catch(e){
    throw new Error('parse');
  }
  if(!parsed.cChar || !parsed.cRom || !parsed.mChar || !parsed.mRom) throw new Error('incomplete');
  return parsed;
}

// <offline-dict> — offline English ↔ Cantonese/Mandarin lookup over dict.json (built by
// scripts/build-dict.mjs; tested by scripts/test-lookup.mjs, which evals this block in Node).
// pairs: hand-checked everyday words (mostly where the two languages differ) — [[english...], cChar, jyutping, mChar, pinyin]
// rows:  [trad, simp, pinyin, jyutping, glosses "/"-joined, mandoFreq, cantoFreq, flags(1=Canto-only, 2=rare)]
const OfflineDict = (() => {
  let rows = null, senses = null, byHead = null, pairByEng = null, pairByChar = null, loading = null, failed = false;
  const HAN = /[㐀-鿿豈-﫿]/;
  const AMBIGUOUS = new Set(['走', '都', '同', '好', '平', '房', '屋', '遲', '掉', '明', '知', '細', '晚', '係', '飯']);
  const CANTO_CHARS = /[嘅咗嚟啲冇喺嘢佢哋睇咩乜噉嗰唔嘞喎㗎啩嚿搵咁冚攞嘥瞓諗嬲氹靚咪掂嗱噏咋未]/;
  const normSense = (s) => s.toLowerCase().replace(/[.!?"“”]/g, '')
    .replace(/^\s*(to|a|an|the|be)\s+/, '').replace(/\s+/g, ' ').trim();
  const normQuery = (s) => normSense(s.replace(/^\s*(how do you say|what is|what's)\s+/i, '').replace(/\([^)]*\)/g, ''));
  function setData(d){
    rows = d.rows;
    senses = rows.map(row => row[4].split('/').map(g => g.replace(/\([^)]*\)/g, ' ').split(/[;,]/).map(normSense).filter(Boolean)));
    byHead = new Map();
    rows.forEach((row, i) => {
      for(const h of [row[0], row[1]]) if(h){ if(!byHead.has(h)) byHead.set(h, []); byHead.get(h).push(i); }
    });
    pairByEng = new Map(); pairByChar = new Map();
    for(const p of d.pairs || []){
      for(const e of p[0]) pairByEng.set(normQuery(e), p);
      pairByChar.set(p[1], p); if(!pairByChar.has(p[3])) pairByChar.set(p[3], p);
    }
  }
  function load(url){
    if(rows) return Promise.resolve(true);
    if(!loading){
      failed = false;
      loading = fetch(url || 'dict.json').then(r => { if(!r.ok) throw new Error('http'); return r.json(); })
        .then(d => { setData(d); return true; })
        .catch(() => { loading = null; failed = true; return false; });
    }
    return loading;
  }
  // How well entry i's English senses match query q: 100 exact, less for a whole-word hit inside a longer sense.
  function matchScore(i, q, qWords){
    let best = 0;
    senses[i].forEach((group, gi) => {
      for(const s of group){
        let sc = 0;
        if(s === q) sc = 100;
        else if(qWords.length <= 3 && (' ' + s + ' ').includes(' ' + q + ' ')){
          const extra = s.split(' ').length - qWords.length;
          sc = extra <= 3 ? 55 - extra * 10 : 0;
        }
        if(sc) best = Math.max(best, sc - gi * 10);
      }
    });
    return best;
  }
  // Pick for words outside the pairs list: strong match + common in Mandarin, nudged by everyday spoken
  // use (HKCanCor: 電腦 over 計算機). Multi-character words beat single characters, which are often
  // bound forms or classical senses (今 vs 現在 for "now").
  const mandoScore = (r, m) => m + r[5] * 3 + r[6] * 2 + (r[0].length > 1 ? 8 : 0) - (r[7] & 2 ? 30 : 0) - (r[7] & 1 ? 1000 : 0);
  const altScore = (r, m) => m + r[5] * 2 + r[6] * 3 - (r[7] & 2 ? 30 : 0);
  const firstSense = (r) => r[4].split('/')[0].replace(/\([^)]*\)/g, '').split(';')[0].trim();
  const fromPair = (p, eng) => ({
    eng, cChar: p[1], cRom: p[2], mChar: p[3], mRom: p[4], same: p[1] === p[3], source: 'dict',
    note: p[1] === p[3] ? '' : `Different word: Cantonese says ${p[1]}, Mandarin says ${p[3]}.`,
  });
  const fromRow = (r, eng) => ({ eng, cChar: r[0], cRom: r[3], mChar: r[0], mRom: r[2], same: true, source: 'dict', note: '' });
  const fromBridge = (b, eng) => ({ eng, cChar: b.c, cRom: b.cr, mChar: b.m, mRom: b.mr, same: b.c === b.m, source: 'dict', note: '' });
  function searchEnglish(raw){
    const q = normQuery(raw);
    if(!q) return [];
    const out = [];
    const pair = pairByEng.get(q);
    if(pair) out.push(fromPair(pair, raw.trim()));
    const qWords = q.split(' ');
    const hits = [];
    for(let i = 0; i < rows.length; i++){
      const m = matchScore(i, q, qWords);
      if(m >= 25) hits.push({ i, m });
    }
    if(!pair && hits.length){
      // Words outside the hand-checked list: assume Cantonese uses the same word (true for most vocabulary),
      // read in Jyutping. Cantonese-only words still show up below as alternatives.
      const best = hits.reduce((a, h) => (mandoScore(rows[h.i], h.m) > mandoScore(rows[a.i], a.m) ? h : a));
      out.push(fromRow(rows[best.i], raw.trim()));
    }
    hits.sort((a, b) => altScore(rows[b.i], b.m) - altScore(rows[a.i], a.m));
    for(const h of hits){
      if(out.length >= 5) break;
      const r = rows[h.i];
      // Alternatives only when they're a close match and a word people actually use.
      if(h.m < 45 || r[5] + r[6] < 8 || out.some(o => o.cChar === r[0] || o.mChar === r[0])) continue;
      out.push({ ...fromBridge(bridgeWord(r[0]), firstSense(r)), alt: true, cantoOnly: !!(r[7] & 1) });
    }
    return out;
  }
  const rowOf = (w) => byHead.has(w) ? rows[byHead.get(w)[0]] : null;
  const pairFor = (w) => AMBIGUOUS.has(w) ? null : pairByChar.get(w);
  // Swap the hand-checked words inside a compound, longest first (喺邊度 -> 在哪裡, 吃飯 -> 食飯).
  function swapInside(word, toMando){
    const out = [];
    for(let i = 0; i < word.length;){
      let len = Math.min(4, word.length - i);
      for(; len > 0; len--){
        const sub = word.slice(i, i + len), pr = pairFor(sub);
        if(pr && sub === (toMando ? pr[1] : pr[3])){ out.push(toMando ? [pr[3], pr[4]] : [pr[1], pr[2]]); break; }
        if(len === 1){ const r = rowOf(sub); out.push([sub, r ? r[toMando ? 2 : 3] : '']); }
      }
      i += len || 1;
    }
    return [out.map(x => x[0]).join(''), out.map(x => x[1]).join(toMando ? '' : ' ')];
  }
  function bridgeWord(word){
    const r = rowOf(word), pr = pairFor(word);
    if(pr && word === pr[1]) return { c: pr[1], cr: pr[2], m: pr[3], mr: pr[4], eng: pr[0][0] };
    // A Mandarin-side word only becomes Cantonese if Cantonese speakers don't use it too (吃 yes, 想 no).
    if(pr && (!r || r[6] <= 2)) return { c: pr[1], cr: pr[2], m: pr[3], mr: pr[4], eng: pr[0][0] };
    let c = word, cr = r[3], m = word, mr = r[2];
    if(word.length > 1 && r[5] <= 4) [m, mr] = swapInside(word, true);                   // Cantonese-only compound
    else if(word.length > 1 && r[6] <= 1 && !(r[7] & 1)) [c, cr] = swapInside(word, false); // Mandarin-only compound
    return { c, cr, m, mr, eng: firstSense(r) };
  }
  // Chinese input: hand-checked pair, exact headword, else greedy longest-match segmentation for readings.
  function searchChinese(raw){
    const text = raw.replace(/[\s，。？！、,.?!]/g, '');
    const pair = pairByChar.get(text);
    if(pair) return [fromPair(pair, pair[0][0])];
    const exact = byHead.get(text);
    if(exact){
      const r = rows[exact.reduce((a, b) => (rows[b][5] + rows[b][6] > rows[a][5] + rows[a][6] ? b : a))];
      return [{ ...fromBridge(bridgeWord(text), firstSense(r)), cantoOnly: !!(r[7] & 1) }];
    }
    // Sentence: split into known words, and swap each word that has a hand-checked counterpart
    // (食 -> 吃) so each line reads in its own language. Single characters with several everyday
    // meanings (走 leave/run, 都 also/all, 好 very/good…) are left alone rather than guessed.
    const parts = [];
    for(let p = 0; p < text.length;){
      let len = Math.min(8, text.length - p), word = null;
      for(; len > 0; len--){ const w = text.slice(p, p + len); if(byHead.has(w) || pairByChar.has(w)){ word = w; break; } }
      if(!word) return [];
      parts.push(bridgeWord(word));
      p += len;
    }
    const cChar = parts.map(x => x.c).join(''), mChar = parts.map(x => x.m).join('');
    // Cantonese grammar words (咗, 未, 嘅…) have no word-for-word Mandarin, so say the line is rough.
    const roughMando = CANTO_CHARS.test(mChar);
    return [{
      eng: parts.map(x => x.eng).join(' + '), cChar, mChar, same: cChar === mChar, source: 'dict', wordByWord: true,
      cRom: parts.map(x => x.cr).join(' '), mRom: parts.map(x => x.mr).join(' '),
      note: roughMando ? 'Word-by-word guess — Cantonese grammar here (e.g. 咗, 未) doesn\'t carry over. Ask AI for natural Mandarin.' : 'Word-by-word guess — check with AI for anything important.',
    }];
  }
  return {
    load, setData,
    get ready(){ return !!rows; }, get failed(){ return failed; },
    search(raw){ if(!rows || !raw || !raw.trim()) return []; return HAN.test(raw) ? searchChinese(raw) : searchEnglish(raw); },
  };
})();

// Built-in and saved words that match what's typed — checked before the dictionary, works with no download.
function searchAppWords(raw){
  const q = raw.trim().toLowerCase().replace(/[?!.]/g, '');
  if(!q) return [];
  const isHan = /[㐀-鿿]/.test(q);
  return allWords().filter(w => isHan
    ? (w.cChar === raw.trim() || w.mChar === raw.trim())
    : w.eng.toLowerCase().replace(/[?!.]/g, '').split(/\s*\/\s*/).concat(w.eng.toLowerCase().replace(/[?!.]/g, '')).includes(q)
  ).slice(0, 3).map(w => ({ ...w, source: 'app' }));
}
function escHTML(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Downscale + re-encode as JPEG before sending, so photos from a phone camera
// (often several MB) don't balloon into a huge base64 payload.
function fileToResizedDataUrl(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ()=>reject(new Error('image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read'));
    reader.readAsDataURL(file);
  });
}

async function scanImageForText(base64Data){
  const prompt = `You are a bilingual OCR and dictionary assistant for a heritage Cantonese speaker learning to speak both Cantonese and Mandarin. Look at the attached image and find any Chinese text visible in it (menus, signs, texts, labels, anything).

For each distinct word or phrase you find (up to 8, skip duplicates), respond with ONLY a raw JSON array (no markdown fences, no preamble, no explanation) where each item has exactly these fields:

{
  "detectedChar": the Chinese characters exactly as they appear in the image,
  "eng": English meaning,
  "type": "word" or "phrase" (use "phrase" for a multi-word expression/sentence someone would say aloud in a situation; "word" for a single vocabulary item or short fixed term),
  "cChar": Cantonese Traditional characters (same as detectedChar if already Cantonese-appropriate),
  "cRom": Jyutping romanization with tone numbers, space-separated,
  "mChar": Mandarin Traditional characters,
  "mRom": Hanyu Pinyin romanization with tone marks, space-separated,
  "lit": a short literal/word-for-word English gloss, ONLY if it meaningfully differs from the idiomatic meaning — otherwise an empty string,
  "note": one short sentence ONLY if Cantonese and Mandarin use genuinely different vocabulary for this concept — otherwise an empty string
}

If there is no Chinese text anywhere in the image, respond with exactly: []`;

  let response;
  try{
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: apiHeaders(),
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 2000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64Data } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });
  }catch(e){
    if(e.message === 'nokey') throw e;
    throw new Error('network');
  }
  if(response.status === 401 || response.status === 403) throw new Error('badkey');
  if(!response.ok) throw new Error('api');
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('');
  const start = textBlocks.indexOf('[');
  const end = textBlocks.lastIndexOf(']');
  if(start === -1 || end === -1 || end < start) throw new Error('parse');
  let parsed;
  try{ parsed = JSON.parse(textBlocks.slice(start, end+1)); }
  catch(e){ throw new Error('parse'); }
  if(!Array.isArray(parsed)) throw new Error('parse');
  return parsed.filter(r => r.cChar && r.cRom && r.mChar && r.mRom);
}

function allWords(){ return VOCAB.concat(customWords); }
function addCustomWord(eng, r, isPhrase){
  const w = {
    id: 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), cat: isPhrase ? 'Phrases' : 'Custom', eng,
    cChar: r.cChar, cRom: r.cRom, mChar: r.mChar, mRom: r.mRom, same: r.cChar === r.mChar,
  };
  if(r.lit){ w.cLit = r.lit; w.mLit = r.lit; }
  if(r.note) w.note = r.note;
  customWords.push(w);
  saveCustomWords();
  return w;
}
// Words saved for later (the AI button while offline). Every item either gets added or shows why it's
// still waiting. Re-checked on launch, when the dictionary finishes loading, on 'online', when the app
// comes back to the foreground (iOS often skips 'online' for home-screen apps) and when the key is saved.
// With an API key the AI translates it (the user asked for AI); without one, the offline dictionary does.
let pendingBusy = false, pendingAgain = false;
const pendingReasons = {}; // text -> why it's still waiting (shown under the item)
const hasAI = () => !IS_STANDALONE || !!apiKey;
const isSavedWord = (r) => customWords.some(w => w.cChar === r.cChar && w.mChar === r.mChar);
const isPhraseText = (t) => t.trim().split(/\s+/).length >= 3 || /\?$/.test(t.trim());
// Built-in/saved words first, then the dictionary — what Add shows and what the queue falls back to.
function offlineMatches(q){
  const app = searchAppWords(q);
  return app.concat(OfflineDict.search(q).filter(r => !app.some(a => a.cChar === r.cChar && a.mChar === r.mChar)));
}
async function processPendingAdds(){
  if(pendingBusy){ pendingAgain = true; return; }
  if(!pendingAdds.length) return;
  pendingBusy = true;
  const done = [], before = JSON.stringify(pendingReasons);
  for(const eng of [...pendingAdds]){
    if(hasAI()){
      if(!navigator.onLine){ pendingReasons[eng] = 'Waiting for internet'; continue; }
      try{
        const r = await translateEntry(eng);
        if(!isSavedWord(r)) addCustomWord(eng, r, r.type === 'phrase');
        done.push(eng);
      }catch(e){
        pendingReasons[eng] = e.message === 'network' ? 'Waiting for internet'
          : e.message === 'badkey' ? 'Couldn\'t translate — your API key was rejected (check Settings)'
          : 'Couldn\'t translate — will try again next time you open the app';
      }
      continue;
    }
    if(!OfflineDict.ready){
      pendingReasons[eng] = OfflineDict.failed ? 'Offline dictionary not downloaded yet — open the app once with internet' : 'Waiting for the offline dictionary';
      continue;
    }
    const top = offlineMatches(eng)[0];
    if(!top){ pendingReasons[eng] = 'No offline match — add an API key in Settings to translate this'; continue; }
    if(top.source === 'dict' && !isSavedWord(top)) addCustomWord(eng, top, !!top.wordByWord || isPhraseText(eng));
    done.push(eng); // built-in or already saved: nothing to add, but it's dealt with
  }
  if(done.length){
    pendingAdds = pendingAdds.filter(t => !done.includes(t));
    done.forEach(t => delete pendingReasons[t]);
    await savePendingAdds();
    showAudioNote(done.length === 1 ? `"${done[0]}" is now in your words.` : `${done.length} saved words are now in your words.`);
  }
  pendingBusy = false;
  if((done.length || JSON.stringify(pendingReasons) !== before) && state.view === 'home' && homeTab === 'add') render();
  if(pendingAgain){ pendingAgain = false; processPendingAdds(); }
}
const onAddOrScan = () => state.view==='home' && (homeTab==='add' || homeTab==='scan');
window.addEventListener('online', ()=>{ if(onAddOrScan()) render(); processPendingAdds(); });
window.addEventListener('offline', ()=>{ if(onAddOrScan()) render(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') processPendingAdds(); });
function wordCategories(){
  return [...new Set(allWords().filter(w=>w.cat!=='Phrases').map(w=>w.cat))];
}

function statusOf(id){ return (progress[id] && progress[id].status) || 'new'; }
function shakyCountOf(id){ return (progress[id] && progress[id].shakyCount) || 0; }
function knownCount(){ return allWords().filter(w=>statusOf(w.id)==='known').length; }
function knownCountInCat(cat){ return allWords().filter(w=>w.cat===cat && statusOf(w.id)==='known').length; }

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildLearnQueue(cats){
  const pool = cats ? allWords().filter(w=>cats.includes(w.cat)) : allWords();
  const learning = shuffle(pool.filter(w=>statusOf(w.id)==='learning'));
  const fresh = shuffle(pool.filter(w=>statusOf(w.id)==='new'));
  let queue = [...learning, ...fresh].slice(0, SESSION_SIZE);
  if(queue.length < SESSION_SIZE){
    const known = shuffle(pool.filter(w=>statusOf(w.id)==='known'));
    queue = [...queue, ...known].slice(0, SESSION_SIZE);
  }
  return queue;
}
function buildQuizQueue(cats){
  const pool = cats ? allWords().filter(w=>cats.includes(w.cat)) : allWords();
  const eligible = shuffle(pool.filter(w=>statusOf(w.id)!=='new'));
  return eligible.slice(0, Math.min(SESSION_SIZE, eligible.length));
}

        ${customWords.length===0 ? `<div class="mic-warn subtle">Nothing added yet — words go into Vocab practice, phrases go into Phrases practice, automatically.</div>` : ''}

          <div class="browse-item">
            <div class="mid">
              <div class="e">${w.eng} <span class="custom-tag">${w.cat==='Phrases'?'Phrase':'Word'}</span></div>

                <span class="c">${w.cRom}</span>
                <span class="m">${w.mRom}</span>

              ${w.cLit?`<div style="font-size:11px;font-style:italic;color:var(--muted);opacity:.75;margin-top:5px;">lit. "${w.cLit}"</div>`:''}
              <div style="font-family:'Noto Serif TC',serif;font-size:13px;color:var(--muted);opacity:.65;margin-top:6px;">${w.cChar}${w.same?'':` · ${w.mChar}`}</div>
            </div>
            <button class="del-btn" data-id="${w.id}" aria-label="Delete">${icon('close')}</button>
          </div>
        `).join('')}
      ` : ''}

      ${isScan ? `
        ${!navigator.onLine ? `<div class="mic-warn subtle">Scan reads photos with AI, so it needs internet. Add works offline for single words.</div>` : ''}
        ${(IS_STANDALONE && !apiKey) ? `<div class="mic-warn" id="scanKeyNudge" style="cursor:pointer;">${icon('gear')} Add your API key in Settings to use this feature standalone — tap here.</div>` : ''}
        <input type="file" accept="image/*" id="scanFileInput" style="display:none;" />
        ${!scanPreviewUrl ? `
          <div class="scan-drop" id="scanDrop">
            ${icon('camera')}
            <div class="t1">Upload a screenshot or photo</div>
            <div class="t2">Menus, signs, texts — anything with Chinese text on it</div>
          </div>
        ` : `
          <div class="scan-preview-wrap">
            <img src="${scanPreviewUrl}" alt="Uploaded photo" />
            <button class="scan-retake" id="scanRetake">${icon('close')} Choose a different photo</button>
          </div>
        `}
        ${scanLoading ? `<div class="scan-loading"><div class="spin"></div> Reading the image…</div>` : ''}
        ${scanErrorMsg ? `<div class="mic-warn" style="margin-top:14px;">${scanErrorMsg}</div>` : ''}
        ${scanResults ? (
          scanResults.length===0
            ? `<div class="mic-warn subtle" style="margin-top:14px;">Didn't find any Chinese text in that image — try a clearer or closer shot.</div>`
            : `<div class="section-label">Found ${scanResults.length} item${scanResults.length===1?'':'s'}</div>
               ${scanResults.map((r,i)=>`
                 <div class="scan-result-card">
                   <div class="scan-result-top">
                     <div class="scan-result-eng">${r.eng} <span class="custom-tag">${r.type==='phrase'?'Phrase':'Word'}</span></div>
                     <button class="scan-add-btn ${r._added?'added':''}" data-idx="${i}">${r._added?'Added ✓':'Add'}</button>
                   </div>
                   <div class="scan-result-rails">
                     <span class="c">${r.cRom}</span>
                     <span class="m">${r.mRom}</span>
                   </div>
                   ${r.lit?`<div style="font-size:11px;font-style:italic;color:var(--muted);opacity:.75;margin:4px 0;">lit. "${r.lit}"</div>`:''}
                   <div style="font-family:'Noto Serif TC',serif;font-size:13px;color:var(--muted);opacity:.65;">${r.detectedChar || r.cChar}</div>
                 </div>
               `).join('')}`
        ) : ''}
      ` : ''}
    </div>
  `;
  app.appendChild(wrap);
  wireSpeakButtons(wrap);

  wrap.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{ homeTab = b.dataset.tab; render(); };
  });
  const progBtn = wrap.querySelector('#progressBtn');
  if(progBtn) progBtn.onclick = ()=>{ state = {view:'progressList'}; render(); };
  const settingsBtn = wrap.querySelector('#settingsBtn');
  if(settingsBtn) settingsBtn.onclick = ()=>{ state = {view:'settings'}; render(); };
  const addKeyNudge = wrap.querySelector('#addKeyNudge');
  if(addKeyNudge) addKeyNudge.onclick = ()=>{ state = {view:'settings'}; render(); };
  const scanKeyNudge = wrap.querySelector('#scanKeyNudge');
  if(scanKeyNudge) scanKeyNudge.onclick = ()=>{ state = {view:'settings'}; render(); };
  const statKnown = wrap.querySelector('#statKnown');
  if(statKnown) statKnown.onclick = ()=>{ state = {view:'progressList', focus:'known'}; render(); };
  const statLearning = wrap.querySelector('#statLearning');
  if(statLearning) statLearning.onclick = ()=>{ state = {view:'progressList', focus:'learning'}; render(); };
  const addInput = wrap.querySelector('#addEng');
  if(addInput){
    let t = null;
    addInput.oninput = ()=>{ addQuery = addInput.value; clearTimeout(t); t = setTimeout(refreshAddResults, 120); };
    addInput.onkeydown = (e)=>{ if(e.key === 'Enter') addInput.blur(); };
    refreshAddResults();
  }
  wrap.querySelectorAll('.pending-del').forEach(b=>{
    b.onclick = ()=>{ delete pendingReasons[pendingAdds[+b.dataset.i]]; pendingAdds.splice(+b.dataset.i, 1); savePendingAdds(); render(); };
  });
  const addSubmit = wrap.querySelector('#addSubmit');
  if(addSubmit) addSubmit.onclick = async ()=>{
    const inputEl = wrap.querySelector('#addEng');
    const eng = inputEl.value.trim();
    if(!eng){ showAudioNote('Type a word or phrase first.'); return; }
    hideAudioNote();
    if(!navigator.onLine){
      if(!pendingAdds.includes(eng)) pendingAdds.push(eng);
      await savePendingAdds();
      addQuery = '';
      showAudioNote(hasAI() ? 'Saved — the AI translates it as soon as you\'re online.' : 'Saved — adding it from the offline dictionary.');
      render();
      processPendingAdds();
      return;
    }
    const originalLabel = addSubmit.innerHTML;
    addSubmit.disabled = true;
    addSubmit.innerHTML = 'Looking up…';
    try{
      const result = await translateEntry(eng);
      addCustomWord(eng, result, result.type === 'phrase');
      addQuery = '';
      hideAudioNote();
      render();
    }catch(e){
      const messages = {
        network: 'No connection reached the translation service — check your internet and try again.',
        api: 'The translation service had a hiccup — try again in a moment.',
        parse: 'Got an unreadable response back — usually works on a retry.',
        incomplete: 'Got a partial response back — usually works on a retry.',
        nokey: 'Add your Anthropic API key in Settings to use this outside Claude.',
        badkey: 'That API key was rejected — check it in Settings.',
      };
      showAudioNote(messages[e.message] || 'Something went wrong — try again.');
      addSubmit.disabled = false;
      addSubmit.innerHTML = originalLabel;
    }
  };
  wrap.querySelectorAll('.del-btn').forEach(b=>{
    b.onclick = ()=>{
      customWords = customWords.filter(w=>w.id!==b.dataset.id);
      delete progress[b.dataset.id];
      saveCustomWords(); saveProgress();
      render();
    };
  });

  const scanFileInput = wrap.querySelector('#scanFileInput');
  const scanDrop = wrap.querySelector('#scanDrop');
  if(scanDrop) scanDrop.onclick = ()=> scanFileInput.click();
  if(scanFileInput) scanFileInput.onchange = async ()=>{
    const file = scanFileInput.files[0];
    if(!file) return;
    scanErrorMsg = null;
    scanResults = null;
    try{
      const dataUrl = await fileToResizedDataUrl(file, 1024);
      scanPreviewUrl = dataUrl;
      scanBase64 = dataUrl.split(',')[1];
      scanLoading = true;
      render();
      const results = await scanImageForText(scanBase64);
      scanResults = results.map(r=>({...r, _added:false}));
      scanLoading = false;
      render();
    }catch(e){
      scanLoading = false;
      const messages = {
        network: 'No connection reached the translation service — check your internet and try again.',
        api: 'The translation service had a hiccup — try again in a moment.',
        parse: 'Got an unreadable response back — usually works on a retry.',
        image: 'Couldn\'t read that image file — try a different photo.',
        read: 'Couldn\'t open that file — try a different photo.',
        nokey: 'Add your Anthropic API key in Settings to use this outside Claude.',
        badkey: 'That API key was rejected — check it in Settings.',
      };
      scanErrorMsg = messages[e.message] || 'Something went wrong reading that image — try again.';
      render();
    }
  };
  const scanRetake = wrap.querySelector('#scanRetake');
  if(scanRetake) scanRetake.onclick = ()=>{
    scanPreviewUrl = null; scanBase64 = null; scanResults = null; scanErrorMsg = null; scanLoading = false;
    render();
  };
  wrap.querySelectorAll('.scan-add-btn').forEach(b=>{
    b.onclick = ()=>{
      const idx = parseInt(b.dataset.idx, 10);
      const r = scanResults[idx];
      if(!r || r._added) return;
      addCustomWord(r.eng, r, r.type === 'phrase');
      r._added = true;
      render();
    };
  });

  const sl = wrap.querySelector('#startLearn');
  if(sl) sl.onclick = ()=>{
    state = {view:'learn', queue: buildLearnQueue(scopeCats), idx:0, revealed:false, results:{gotIt:0,shaky:0}};
    render();
  };
  const qb = wrap.querySelector('#startQuiz');
  if(qb) qb.onclick = ()=>{
    const q = buildQuizQueue(scopeCats);
    if(q.length===0) return;
    state = {view:'quiz', queue:q, idx:0, sub:0, score:0, answered:false};
    render();
  };
  wrap.querySelectorAll('.cat-card').forEach(b=>{
    b.onclick = ()=>{ state = {view:'browse', cat:b.dataset.cat}; render(); };
  });
  const bp = wrap.querySelector('#browsePhrases');
  if(bp) bp.onclick = ()=>{ state = {view:'browse', cat:'Phrases'}; render(); };
  wrap.querySelectorAll('.lt-btn').forEach(b=>{
    b.onclick = ()=>{ roleplayLang = b.dataset.lang; render(); };
  });
  wrap.querySelectorAll('.scenario-card').forEach(b=>{
    b.onclick = ()=>{
      const scenario = SCENARIOS.find(s=>s.id===b.dataset.sid);
      state = {view:'roleplay', scenario, idx:0, lang:roleplayLang, transcript:'', listening:false, helpShown:false};
      render();
    };
  });
}

        <button class="rate-btn got-it" id="rateGot">Got it<span>Feels solid</span></button>

  const shaky = wrap.querySelector('#rateShaky');

  if(shaky) shaky.onclick = ()=> answerLearn(w,'learning');
  if(got) got.onclick = ()=> answerLearn(w,'known');
}
function answerLearn(w, status){
  const prevShaky = (progress[w.id] && progress[w.id].shakyCount) || 0;
  progress[w.id] = { status, shakyCount: status==='learning' ? prevShaky+1 : prevShaky };
  if(status==='known') state.results.gotIt++; else state.results.shaky++;
  saveProgress();
  state.idx++; state.revealed = false;
  render();
}

function renderLearnSummary(){
  const today = todayStr();
  if(meta.lastPracticeDate !== today){
    if(meta.lastPracticeDate){
      const diffDays = Math.round((new Date(today) - new Date(meta.lastPracticeDate))/86400000);
      meta.streak = diffDays===1 ? (meta.streak||0)+1 : 1;

function renderQuiz(){
  const {queue, idx, sub, score, answered} = state;
  if(idx >= queue.length){ state.view='quizSummary'; return render(); }
  const w = queue[idx];
  const isJyutping = sub===0;
  const correctVal = isJyutping ? w.cRom : w.mRom;
  const pool = allWords().filter(x=>x.id!==w.id).map(x=> isJyutping ? x.cRom : x.mRom);
  const distractors = shuffle([...new Set(pool)]).slice(0,3);
  const options = shuffle([correctVal, ...distractors]);

  const wrap = document.createElement('div');
  wrap.className = 'fade-in';
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.minHeight='100vh';
  const top = sessionTopBar(idx, queue.length, ()=>{state={view:'home'};render();});
  top.querySelector('.dots').insertAdjacentHTML('afterend', `<div class="score-pill">${score}</div>`);
  wrap.appendChild(top);

  const body = document.createElement('div');
  body.className = 'session-body';
  body.innerHTML = `
    <div class="quiz-q">How do you say this in ${isJyutping?'Cantonese':'Mandarin'}?</div>
    <div class="quiz-eng" style="font-size:22px;font-weight:700;color:var(--paper);margin-bottom:30px;">${w.eng}</div>
    <div class="opt-grid">
      ${options.map((o,i)=>`<button class="opt" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}
    </div>
  `;
  wrap.appendChild(body);
  app.appendChild(wrap);

  wrap.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(state.answered) return;
      state.answered = true;
      const val = btn.dataset.val;
      const correct = val === correctVal;
      wrap.querySelectorAll('.opt').forEach(b=>{
        b.disabled = true;
        if(b.dataset.val === correctVal) b.classList.add('correct');
        else if(b === btn && !correct) b.classList.add('wrong');
      });
      if(correct) state.score++;
      setTimeout(()=>{
        if(sub===0){ state.sub=1; state.answered=false; }
        else { state.idx++; state.sub=0; state.answered=false; }
        render();
      }, 750);
    };
  });
}

function renderRoleplaySession(){
  const {scenario, idx, lang, transcript, listening, helpShown} = state;
  if(idx >= scenario.turns.length){ state.view='roleplaySummary'; return render(); }
  const t = scenario.turns[idx];
  const isCanto = lang === 'canto';
  const npcChar = isCanto ? t.npcCChar : t.npcMChar;
  const npcRom = isCanto ? t.npcCRom : t.npcMRom;
  const expChar = isCanto ? t.expCChar : t.expMChar;
  const expRom = isCanto ? t.expCRom : t.expMRom;
  const sttLang = isCanto ? 'zh-HK' : 'zh-CN';
  const kind = isCanto ? 'canto' : 'mando';

  const wrap = document.createElement('div');
  wrap.className = 'fade-in';
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.minHeight='100vh';
  wrap.appendChild(sessionTopBar(idx, scenario.turns.length, ()=>{ stopRecognition(); state={view:'home'}; render(); }));

  const body = document.createElement('div');
  body.className = 'session-body';
  body.innerHTML = `
    <div class="cat-tag">${scenario.title} · ${isCanto?'Cantonese':'Mandarin'}</div>
    <div class="npc-bubble">
      <div class="npc-eng">${t.npcEng}</div>
      <div class="npc-rom ${kind}">${npcRom} ${speakBtnHTML(npcChar,kind)}</div>
    </div>

    <div class="your-turn-label">Your turn — respond out loud</div>
    <button class="mic-btn ${listening?'live':''}" id="micBtn">
      ${icon('mic')}
      <span>${listening?'Listening…':'Tap to speak'}</span>
    </button>
    <div class="transcript-box ${transcript?'has-text':''}" id="transcriptBox">${transcript ? `“${transcript}”` : 'What you say will appear here'}</div>

    <div class="help-row">
      <button class="btn-secondary" id="helpBtn">${helpShown?'Hide help':'Need help?'}</button>
      <button class="btn-secondary next-btn" id="nextTurnBtn">Next</button>
    </div>

    ${helpShown ? `
      <div class="help-panel">
        <div class="help-label">Try saying</div>
        <div class="help-eng">${t.expEng}</div>
        <div class="help-rom ${kind}">${expRom}</div>
        <div class="help-char">${expChar}</div>
      </div>
    ` : ''}
  `;
  wrap.appendChild(body);
  app.appendChild(wrap);
  wireSpeakButtons(wrap);

  wrap.querySelector('#helpBtn').onclick = ()=>{ state.helpShown = !state.helpShown; render(); };
  wrap.querySelector('#nextTurnBtn').onclick = ()=>{
    stopRecognition();
    state.idx++; state.transcript=''; state.listening=false; state.helpShown=false;
    render();
  };
  wrap.querySelector('#micBtn').onclick = ()=>{
    if(state.listening){ stopRecognition(); state.listening=false; render(); return; }
    if(!SpeechRec){ showAudioNote('Speech recognition isn\'t supported in this browser — try Chrome.'); return; }
    state.listening = true; render();
    startRecognition(sttLang,
      (text)=>{ state.transcript = text; const box=document.getElementById('transcriptBox'); if(box){ box.textContent = `"${text}"`; box.classList.add('has-text'); } },
      ()=>{ state.listening=false; const btn=document.getElementById('micBtn'); if(btn){ btn.classList.remove('live'); btn.querySelector('span').textContent='Tap to speak'; } },
      (err)=>{ state.listening=false; render(); showAudioNote(err==='unsupported' ? 'Speech recognition isn\'t supported in this browser.' : 'Couldn\'t access the microphone — check your browser permissions.'); }
    );
  };
}

  wrap.querySelector('.dots').outerHTML = `<div style="flex:1;font-weight:700;font-size:15px;">Settings</div>`;

  const body = document.createElement('div');
  body.style.padding = '4px 20px 30px 20px';

  if(!IS_STANDALONE){
    body.innerHTML = `
      <div class="mic-warn subtle">You're using this inside Claude — Add and Scan already work here with no setup needed. An API key is only needed for the standalone version installed on your phone.</div>
    `;
    wrap.appendChild(body);
    app.appendChild(wrap);
    return;
  }

  body.innerHTML = `
    <div class="add-label" style="margin-top:6px;">Anthropic API key</div>
    <input class="add-input" id="apiKeyInput" type="password" placeholder="sk-ant-..." value="${apiKey ? apiKey : ''}" />
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6;">
      Needed for Add and Scan to work standalone — everything else (practice, quiz, browse, audio) works without one.
      <br><br>
      Get a key at <b style="color:var(--paper);">console.anthropic.com</b> → API Keys. Usage is billed to your own account, typically a fraction of a cent per lookup.
      <br><br>
      This key is stored only in this browser on this device, never sent anywhere except directly to Anthropic. Treat it like a password — anyone with access to this device's browser storage could see it.
    </div>
    <button class="btn-primary" id="saveKeyBtn" style="margin-top:16px;">Save key</button>
    ${apiKey ? `<button class="btn-secondary" id="clearKeyBtn">Remove saved key</button>` : ''}
    <div class="add-label" style="margin-top:28px;">Offline dictionary</div>
    <div style="font-size:11.5px;color:var(--muted);line-height:1.6;">
      ${OfflineDict.ready ? 'Downloaded — Add works without internet.' : 'Not downloaded yet — it downloads automatically the next time you\'re online.'}
      <br><br>
      Built from CC-CEDICT (CC BY-SA 4.0, MDBG) and CC-Canto (CC BY-SA 3.0, Pleco Inc.), with word frequencies from HKCanCor (CC BY 4.0) and jieba (MIT), and Jyutping from to-jyutping (BSD-2-Clause, CanCLID). The dictionary file is shared under CC BY-SA 4.0.
    </div>
  `;
  wrap.appendChild(body);
  app.appendChild(wrap);

  wrap.querySelector('#saveKeyBtn').onclick = async ()=>{
    const val = wrap.querySelector('#apiKeyInput').value.trim();
    if(!val){ showAudioNote('Paste your API key first.'); return; }
    await saveApiKey(val);
    processPendingAdds();
    showAudioNote('API key saved.');
    render();
  };
  const clearBtn = wrap.querySelector('#clearKeyBtn');
  if(clearBtn) clearBtn.onclick = async ()=>{
    await clearApiKey();
    render();
  };
}

// Library (book icon): every word — built-in and added — in one alphabetical list with live search.
// A coloured dot marks learning status; the chips filter by it (the home Known/Learning stats open
// the matching filter, so their numbers always agree with what's listed).
let libQuery = '';
const LIB_FILTERS = [['all','All'],['known','Known'],['learning','Learning'],['new','New']];
const sortKey = (w) => w.eng.toLowerCase().replace(/^(to|the|a|an) /, '');
// Lowercase, no tone marks/numbers or spaces: "chī" -> "chi", "ting1 jat6" -> "tingjat".
const plain = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[0-9\s'·.,!?]/g, '');
function renderProgressList(){
  const wrap = document.createElement('div');
  wrap.className = 'fade-in';
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.minHeight='100vh';
  wrap.appendChild(sessionTopBar(0,0,()=>{state={view:'home'};render();}));
  wrap.querySelector('.dots').outerHTML = `<div style="flex:1;font-weight:700;font-size:15px;">Library</div>`;
  const body = document.createElement('div');
  body.className = 'browse-list';
  body.innerHTML = `
    <input class="add-input" id="libSearch" placeholder="Search English, Jyutping, Pinyin or 字" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" value="${escHTML(libQuery)}" />
    <div class="lib-chips" id="libChips"></div>
    <div id="libList"></div>
  `;
  wrap.appendChild(body);
  app.appendChild(wrap);
  const input = body.querySelector('#libSearch');
  input.oninput = ()=>{ libQuery = input.value; refreshLibrary(); };
  input.onkeydown = (e)=>{ if(e.key === 'Enter') input.blur(); };
  refreshLibrary();
}
function refreshLibrary(){
  const filter = state.focus || 'all';
  const words = allWords().slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  const q = libQuery.trim().toLowerCase(), qp = plain(q);
  const matches = (w) => !q || w.eng.toLowerCase().includes(q) || (qp && (plain(w.cRom).includes(qp) || plain(w.mRom).includes(qp)))
    || w.cChar.includes(q) || w.mChar.includes(q);
  const found = words.filter(matches);
  const counts = { all: found.length, known: 0, learning: 0, new: 0 };
  found.forEach(w => counts[statusOf(w.id)]++);
  const shown = filter === 'all' ? found : found.filter(w => statusOf(w.id) === filter);
  document.getElementById('libChips').innerHTML = LIB_FILTERS.map(([k, label]) =>
    `<button class="lib-chip ${filter===k?'active':''}" data-f="${k}">${k==='all'?'':`<span class="p-dot ${k}"></span>`}${label} <span class="lib-n">${counts[k]}</span></button>`).join('');
  document.querySelectorAll('.lib-chip').forEach(c => { c.onclick = ()=>{ state.focus = c.dataset.f === 'all' ? null : c.dataset.f; refreshLibrary(); }; });
  const list = document.getElementById('libList');
  list.innerHTML = shown.length ? shown.map(w => {
    const sc = shakyCountOf(w.id);
    return `
    <div class="progress-row lib-row">
      <span class="p-dot ${statusOf(w.id)}" title="${statusOf(w.id)}"></span>
      <div class="p-mid">
        <div class="p-eng">${escHTML(w.eng)}</div>
        <div class="p-rom">${escHTML(w.cRom)} <span class="sep">·</span> ${escHTML(w.mRom)}</div>
      </div>
      ${sc > 0 ? `<div class="lib-shaky">${sc}× shaky</div>` : ''}
      <div class="lib-chars">${escHTML(w.cChar)}</div>
    </div>`;
  }).join('') : `<div class="mic-warn subtle" style="margin-top:6px;">${q ? 'No words match that search.' : 'Nothing here yet.'}</div>`;
}

if(IS_STANDALONE && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
  // When a new version's service worker takes over, reload once so the update shows now rather than
  // on the launch after next. Skipped on first install (nothing was in control before).
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

loadData();
</script>
</body>
